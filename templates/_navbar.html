<header>
  <!-- navbar -->
  <nav
    class="navbar navbar-expand-lg navbar-dark py-3 fixed-top shadow-lg navbar-custom"
  >
    <div class="container">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="40"
        height="40"
        viewBox="0 0 24 24"
        fill="currentColor"
        class="icon icon-tabler icons-tabler-filled icon-tabler-meteor me-2"
      >
        <path
          stroke="none"
          d="M0 0h24v24H0z"
          fill="none"
        />
        <path
          d="M21.874 3.486l-4.174 7.514h3.3c.846 0 1.293 .973 .791 1.612l-.074 .085l-6.9 7.095a7.5 7.5 0 1 1 -10.21 -10.974l7.746 -6.58c.722 -.614 1.814 .028 1.628 .958l-.577 2.879l7.11 -3.95c.88 -.488 1.849 .481 1.36 1.36m-12.374 7.515a3.5 3.5 0 0 0 -3.495 3.308l-.005 .192a3.5 3.5 0 1 0 3.5 -3.5"
        />
      </svg>
      <a
        class="navbar-brand"
        href="/"
        >NeuralNet</a
      >
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div
        class="collapse navbar-collapse"
        id="nav"
      >
        <ul class="navbar-nav mx-auto">
          <li class="nav-item">
            <a
              class="nav-link"
              href="/"
              >Home</a
            >
          </li>
          <li class="nav-item">
            <a
              class="nav-link"
              href="/about"
              >About</a
            >
          </li>
          {% if username %}
          <li class="nav-item">
            <a
              class="nav-link link-quiz"
              href="/quiz"
              >Avvia il Quiz</a
            >
          </li>
          {% endif %}
        </ul>
        {% if username %}
        <div class="d-flex justify-content-center align-items-center gap-3">
          Ciao, {{ username}}
          <a
            class="btn btn-outline-custom"
            href="/logout"
            >Logout</a
          >
        </div>
        {% else %}
        <div>
          <a
            class="nav-link d-inline me-3"
            href="/login"
            >Login</a
          >
          <a
            class="btn btn-primary-custom"
            href="/register"
            >Registrati</a
          >
        </div>
        {% endif %}
      </div>
    </div>
  </nav>
</header>
