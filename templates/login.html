{% extends "base.html" %} {% block title %}Login - NeuralNet{% endblock %} {%
block content %}
<section
  class="container d-flex justify-content-center align-items-center"
  style="min-height: 100vh"
>
  <div class="col-md-5">
    <div class="auth-card">
      <h3 class="text-center fw-bold mb-4">Login</h3>
      <p class="text-center mb-4">Accedi al tuo profilo</p>

      <form method="post">
        <div class="mb-3">
          <label class="form-label small">USERNAME</label>
          <input
            type="text"
            name="username"
            class="form-control"
            placeholder="Enter username"
          />
        </div>

        <div class="mb-4">
          <label class="form-label small">PASSWORD</label>
          <input
            type="password"
            name="password"
            class="form-control"
            placeholder="Enter password"
          />
        </div>

        <button class="btn btn-custom w-100">Start</button>
      </form>

      <div class="text-center mt-4">
        <small
          >Non hai un account?
          <a
            href="/register"
            class="small-link"
            >Registrati</a
          >
        </small>
      </div>
    </div>
  </div>
</section>
{% endblock %}
